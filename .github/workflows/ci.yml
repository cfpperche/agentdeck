name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  go:
    name: Go (vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI (for go:embed)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Shell scripts
        run: bash -n scripts/*.sh
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/agentdeck .
      - name: Verify make clean leaves a buildable tree
        run: |
          make clean
          go build -o /dev/null .
      - uses: actions/upload-artifact@v4
        with:
          name: agentdeck-linux-amd64
          path: bin/agentdeck

  web-test:
    name: Web (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  smoke:
    name: Smoke E2E (real binary + fake agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shim deps (fake SDK path)
        working-directory: agent-sdk-shim
        run: npm install --no-fund --no-audit
      - run: go build -o bin/agentdeck .
      - run: scripts/smoke-e2e.sh

  legacy:
    name: Legacy (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q legacy
